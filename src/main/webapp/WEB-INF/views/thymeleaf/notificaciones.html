<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notificaciones | Agarra la Pala</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/home.css}">
  <link rel="stylesheet" th:href="@{/css/ofertas-empleador.css}">
</head>

<body class="employer-body">
  <nav th:replace="~{fragments/navbar :: appNavbar('notifications', false, true)}"></nav>
  <main class="page-container employer-page">
    <section class="employer-panel" aria-labelledby="notifications-title">
      <h1 id="notifications-title">Notificaciones</h1>
      <p th:if="${mensaje}" class="alert alert-success" role="status" th:text="${mensaje}"></p>
      <p th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></p>

      <section aria-labelledby="invitations-title">
        <h2 id="invitations-title">Invitaciones a postularte</h2>
        <div th:if="${#lists.isEmpty(invitaciones)}" class="notification-card">
          Todavía no recibiste invitaciones.
        </div>
        <div class="invitation-list" th:unless="${#lists.isEmpty(invitaciones)}">
          <article class="invitation-card" th:each="invitacion : ${invitaciones}">
            <h3 class="h5" th:text="${invitacion.oferta.titulo}">Título de la oferta</h3>
            <p>
              <span>La empresa </span>
              <strong th:text="${#strings.isEmpty(invitacion.empleador.empresa) ? invitacion.oferta.empresa : invitacion.empleador.empresa}">Empresa</strong>
              <span> te invitó a postularte.</span>
            </p>
            <p>Estado: <strong th:text="${invitacion.estado}">PENDIENTE</strong></p>
            <a class="btn btn-outline-primary"
               th:href="@{/vacantes/detalle(fuente='LOCAL', id=${invitacion.oferta.id})}">
              Ver oferta
            </a>
            <form th:if="${invitacion.estado.toString() == 'PENDIENTE'}"
                  th:action="@{/invitaciones/{id}/rechazar(id=${invitacion.id})}" method="post"
                  class="d-inline">
              <button class="btn btn-outline-danger" type="submit">Descartar invitación</button>
            </form>
          </article>
        </div>
      </section>

      <section class="mt-4" aria-labelledby="other-notifications-title">
        <h2 id="other-notifications-title">Avisos</h2>
        <div th:if="${#lists.isEmpty(notificaciones)}" class="notification-card">
          No hay notificaciones para mostrar.
        </div>
        <div class="notification-list" th:unless="${#lists.isEmpty(notificaciones)}">
          <article class="notification-card" th:each="notificacion : ${notificaciones}"
                   th:classappend="${!notificacion.leida} ? ' unread' : ''">
            <p th:text="${notificacion.mensaje}">Mensaje de notificación</p>
            <small th:text="${#temporals.format(notificacion.fecha, 'dd/MM/yyyy HH:mm')}">Fecha</small>
            <a class="btn btn-link" th:href="@{/notificaciones/{id}/abrir(id=${notificacion.id})}">
              Abrir
            </a>
          </article>
        </div>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>
  <footer th:replace="~{fragments/footer :: appFooter}"></footer>
</body>

</html>
