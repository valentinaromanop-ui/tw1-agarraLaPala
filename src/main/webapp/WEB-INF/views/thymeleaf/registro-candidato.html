<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Registro de candidato | Agarra la Pala</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/home.css}">
  <link rel="stylesheet" th:href="@{/css/vacantes.css}">
  <link rel="stylesheet" th:href="@{/css/login.css}">
  <link rel="stylesheet" th:href="@{/css/registro-flujos.css}">
</head>

<body>
  <nav th:replace="~{fragments/navbar :: appNavbar('register', false, false)}">
    <a class="navbar-brand" th:href="@{/home}">UNLAM</a>
  </nav>

  <main role="main" class="container login-page">
    <section class="login-box" aria-labelledby="registro-title">
      <h1 id="registro-title" class="h3">Registro de persona candidata</h1>
      <hr class="colorgraph">
      <form th:action="@{/registro/candidato}" th:object="${datosRegistroCandidato}" method="post">
        <div class="mb-3">
          <label class="form-label" for="nombre">Nombre</label>
          <input th:field="*{nombre}" id="nombre" type="text" class="form-control" autocomplete="given-name" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="apellido">Apellido</label>
          <input th:field="*{apellido}" id="apellido" type="text" class="form-control" autocomplete="family-name" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">Correo electrónico</label>
          <input th:field="*{email}" id="email" type="email" class="form-control" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Contraseña</label>
          <input th:field="*{password}" id="password" type="password" class="form-control" autocomplete="new-password" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="confirmarPassword">Repetir contraseña</label>
          <input th:field="*{confirmarPassword}" id="confirmarPassword" type="password" class="form-control" autocomplete="new-password" required>
        </div>
        <fieldset class="skills-fieldset">
          <legend>Habilidades</legend>
          <div class="skill-options">
            <div class="skill-option" th:each="habilidad, iterStat : ${habilidadesDisponibles}">
              <input class="skill-checkbox" type="checkbox" name="habilidades" th:value="${habilidad}"
                th:checked="${#lists.contains(datosRegistroCandidato.habilidades, habilidad)}"
                th:id="${'habilidad-' + iterStat.index}">
              <label class="skill-chip" th:for="${'habilidad-' + iterStat.index}"
                th:text="${habilidad}">Java</label>
            </div>
          </div>
        </fieldset>
        <p th:if="${error != null}" class="alert alert-danger" role="alert" th:text="${error}"></p>
        <button id="btn-registrar" class="btn btn-lg btn-primary" type="submit">Registrarme</button>
      </form>
      <a class="login-back-link" th:href="@{/registro}">Volver a la elección</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>
</body>

</html>
