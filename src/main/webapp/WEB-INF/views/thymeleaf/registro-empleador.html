<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Registro de empleador | Agarra la Pala</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/login.css}">
  <link rel="stylesheet" th:href="@{/css/registro-flujos.css}">
</head>

<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <a class="navbar-brand" th:href="@{/home}">UNLAM</a>
  </nav>

  <main role="main" class="container login-page">
    <section class="login-box" aria-labelledby="registro-title">
      <h1 id="registro-title" class="h3">Registro de empleador</h1>
      <hr class="colorgraph">
      <form th:action="@{/registro/empleador}" th:object="${datosRegistroEmpleador}" method="post">
        <div class="mb-3">
          <label class="form-label" for="empresa">Nombre de la empresa</label>
          <input th:field="*{empresa}" id="empresa" type="text" class="form-control" autocomplete="organization" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="legajo">Número de legajo</label>
          <input th:field="*{legajo}" id="legajo" type="text" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">Correo electrónico</label>
          <input th:field="*{email}" id="email" type="email" class="form-control" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Contraseña</label>
          <input th:field="*{password}" id="password" type="password" class="form-control" autocomplete="new-password" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="confirmarPassword">Repetir contraseña</label>
          <input th:field="*{confirmarPassword}" id="confirmarPassword" type="password" class="form-control" autocomplete="new-password" required>
        </div>
        <p th:if="${error != null}" class="alert alert-danger" role="alert" th:text="${error}"></p>
        <button id="btn-registrar" class="btn btn-lg btn-primary" type="submit">Registrarme</button>
      </form>
      <a class="login-back-link" th:href="@{/registro}">Volver a la elección</a>
    </section>
  </main>
</body>

</html>
