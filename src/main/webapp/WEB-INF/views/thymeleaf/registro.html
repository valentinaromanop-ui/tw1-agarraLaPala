<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Registrarse | Agarra la Pala</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/home.css}">
  <link rel="stylesheet" th:href="@{/css/vacantes.css}">
  <link rel="stylesheet" th:href="@{/css/login.css}">
  <link rel="stylesheet" th:href="@{/css/registro-flujos.css}">
</head>

<body>
  <nav th:replace="~{fragments/navbar :: appNavbar('register', false, false)}">
    <a class="navbar-brand" th:href="@{/home}">UNLAM</a>
  </nav>

  <main role="main" class="container login-page">
    <section class="login-box login-choice-box" aria-labelledby="registro-title">
      <h1 id="registro-title" class="h3">Creá tu cuenta</h1>
      <hr class="colorgraph">
      <div class="login-choice-options">
        <a id="btn-registro-empleador" class="btn btn-lg btn-primary" th:href="@{/registro/empleador}">
          Soy reclutador / empleador
        </a>
        <a id="btn-registro-candidato" class="btn btn-lg btn-primary" th:href="@{/registro/candidato}">
          Busco trabajo
        </a>
      </div>
      <a class="login-back-link" th:href="@{/login}">¿Ya tenés cuenta? Iniciá sesión</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>
  <footer th:replace="~{fragments/footer :: appFooter}"></footer>
</body>

</html>
