<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invitación a entrevista | Agarra la Pala</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/home.css}">
  <link rel="stylesheet" th:href="@{/css/vacantes.css}">
  <link rel="stylesheet" th:href="@{/css/ofertas-empleador.css}">
</head>
<body class="employer-body">
  <nav th:replace="~{fragments/navbar :: appNavbar('applications', false, false)}"></nav>
  <main class="page-container employer-page">
    <section class="employer-panel" aria-labelledby="invitacion-titulo">
      <h1 id="invitacion-titulo">Te invitaron a una entrevista</h1>
      <p th:if="${entrevista.postulacion.titulo != null}">
        Oferta: <strong th:text="${entrevista.postulacion.titulo}">Oferta laboral</strong>
      </p>
      <p th:if="${entrevista.postulacion.empresa != null}">
        Empresa: <span th:text="${entrevista.postulacion.empresa}">Empresa</span>
      </p>
      <p>Invitación recibida el
        <time th:datetime="${entrevista.fechaInvitacion}"
          th:text="${#temporals.format(entrevista.fechaInvitacion, 'dd/MM/yyyy HH:mm')}"></time>.
      </p>
      <a class="btn btn-primary" th:href="@{/postulaciones}">Volver a mis postulaciones</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>
  <footer th:replace="~{fragments/footer :: appFooter}"></footer>
</body>
</html>
