<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Vacantes recomendadas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>

<body>
  <main class="container py-4">
    <a th:href="@{/home}">Volver al inicio</a>

    <h1>Vacantes recomendadas</h1>
    <p>Ofertas para: <span th:text="${#strings.listJoin(skills, ', ')}"></span></p>

    <p th:if="${error != null}" th:text="${error}" class="alert alert-danger" role="alert"></p>

    <div th:if="${vacantes != null}">
      <p th:if="${#lists.isEmpty(vacantes)}" role="status">
        No encontramos vacantes con esas skills.
      </p>

      <div th:each="vacante : ${vacantes}" class="card mb-3">
        <div class="card-body">
          <h2 class="h5" th:text="${vacante.titulo}">Título de la vacante</h2>
          <p>
            <strong th:text="${vacante.empresa}">Empresa</strong> ·
            <span th:text="${vacante.ubicacion}">Ubicación</span> ·
            <span th:text="${vacante.modalidad}">Modalidad</span>
          </p>
          <p>
            Skills coincidentes (<span th:text="${#lists.size(vacante.skills)}"></span>):
            <span th:text="${#strings.listJoin(vacante.skills, ', ')}"></span>
          </p>
          <p>
            Publicación (UTC):
            <span th:if="${vacante.fechaPublicacion != null}"
              th:text="${#temporals.format(vacante.fechaPublicacion, 'dd/MM/yyyy HH:mm')}"></span>
            <span th:if="${vacante.fechaPublicacion == null}">Sin fecha informada</span>
          </p>
          <a th:if="${vacante.url != null}" th:href="${vacante.url}"
            class="btn btn-primary" target="_blank" rel="noopener noreferrer">
            Ver oferta en <span th:text="${vacante.fuente}">Jobicy</span>
          </a>
          <p th:if="${vacante.fuente == 'LOCAL'}">Oferta de nuestra plataforma</p>
        </div>
      </div>
    </div>
  </main>
</body>

</html>
