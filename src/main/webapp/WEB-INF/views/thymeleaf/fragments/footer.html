<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="appFooter" class="site-footer">
  <div class="container footer-content">
    <div>
      <a class="footer-brand" th:href="@{/home}">Agarra la Pala</a>
      <p>Menos búsqueda. Más oportunidades.</p>
      <div class="social-links" style="margin-top:0.75rem;">
        <a href="#" aria-label="Instagram"><i class="bi bi-instagram" aria-hidden="true"></i></a>
        <a href="#" aria-label="Facebook"><i class="bi bi-facebook" aria-hidden="true"></i></a>
        <a href="#" aria-label="LinkedIn"><i class="bi bi-linkedin" aria-hidden="true"></i></a>
        <a href="#" aria-label="Twitter X"><i class="bi bi-twitter-x" aria-hidden="true"></i></a>
        <a href="#" aria-label="TikTok"><i class="bi bi-tiktok" aria-hidden="true"></i></a>
      </div>
    </div>
    <section class="newsletter" aria-labelledby="newsletter-titulo">
      <h2 id="newsletter-titulo">Sumate al newsletter</h2>
      <p>Dejanos tu correo para recibir novedades de Agarra la Pala.</p>
      <form th:action="@{/newsletter}" method="post" class="newsletter-form">
        <label for="newsletter-email">Tu correo electrónico</label>
        <div class="newsletter-fields">
          <input id="newsletter-email" name="email" type="email" maxlength="250" autocomplete="email" placeholder="tu@correo.com" aria-describedby="newsletter-resultado" required>
          <button type="submit">Suscribirme</button>
        </div>
      </form>
      <div id="newsletter-resultado" class="newsletter-result" role="status" aria-live="polite"></div>
    </section>
  </div>
  <script th:src="@{/js/newsletter.js}" defer></script>
</footer>
<div th:fragment="resultadoNewsletter">
  <p th:if="${mensajeNewsletter != null}" th:text="${mensajeNewsletter}" class="newsletter-success"></p>
  <p th:if="${errorNewsletter != null}" th:text="${errorNewsletter}" class="newsletter-error"></p>
</div>
</body>
</html>
