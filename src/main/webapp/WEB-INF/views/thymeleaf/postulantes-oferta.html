<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Postulantes | Agarra la Pala</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kad2F9CUG65" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/home.css}">
  <link rel="stylesheet" th:href="@{/css/ofertas-empleador.css}">
</head>

<body class="employer-body">
  <nav th:replace="~{fragments/navbar :: appNavbar('searches', false, true)}">
    <div class="container navbar-container employer-navbar-container">
      <a class="navbar-brand" th:href="@{/home}">Agarra la Pala</a>
      <div th:replace="~{fragments/navbar :: sessionActions(@{/empleador/perfil}, 'Perfil de empresa')}"></div>
    </div>
  </nav>

  <main class="page-container employer-page">
    <a class="btn btn-outline-light page-back" th:href="@{/busquedas-Empleador}">
      <i class="bi bi-arrow-left" aria-hidden="true"></i> Volver a mis búsquedas
    </a>
    <section class="employer-panel" aria-labelledby="postulantes-title">
      <p class="employer-eyebrow"><i class="bi bi-people" aria-hidden="true"></i> Postulaciones recibidas</p>
      <h1 id="postulantes-title">Postulantes</h1>
      <p class="employer-intro" th:text="${vacante.titulo}">Oferta publicada</p>

      <p th:if="${#lists.isEmpty(postulantes)}" class="empty-searches" role="status">
        Todavía no hay postulantes.
      </p>

      <div th:unless="${#lists.isEmpty(postulantes)}" class="table-responsive">
        <table class="table employer-table postulantes-table align-middle">
          <thead>
            <tr>
              <th scope="col">Correo</th>
              <th scope="col">Habilidades</th>
              <th scope="col">Fecha de postulación</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="postulante : ${postulantes}">
              <td th:text="${postulante.email}"></td>
              <td th:text="${#lists.isEmpty(postulante.habilidades) ? 'Sin habilidades cargadas' : #strings.listJoin(postulante.habilidades, ', ')}"></td>
              <td th:text="${#temporals.format(postulante.fechaPostulacion, 'dd/MM/yyyy HH:mm')}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>

</html>
