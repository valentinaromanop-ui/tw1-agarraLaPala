<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agarra la Pala | Cuestionario IA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/home.css}" />
    <link rel="stylesheet" th:href="@{/css/ia.css}" />
</head>
<body class="ia-pagina">
<nav th:replace="~{fragments/navbar :: appNavbar('jobs', true, false)}"></nav>

<main class="ia-contenedor">
    <header class="ia-encabezado">
        <div class="ia-icono"><i class="bi bi-robot" aria-hidden="true"></i></div>
        <div>
            <h1>Cuestionario de la oferta</h1>
            <p>Respondé con tus palabras. La empresa verá tu puntaje y una devolución generada por IA.</p>
        </div>
    </header>

    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <form method="post" th:action="@{/cuestionario-ia/{id}(id=${postulacionId})}"
          onsubmit="const b=this.querySelector('button[type=submit]'); b.disabled=true; b.textContent='Evaluando tus respuestas…';">
        <div class="ia-aviso">
            <i class="bi bi-lightbulb" aria-hidden="true"></i>
            Tip: ejemplos concretos y respuestas de unas 3 o 4 oraciones suelen puntuar mejor.
        </div>

        <section class="ia-tarjeta" th:each="pregunta, estado : ${preguntas}">
            <div class="ia-pregunta">
                <span class="ia-numero" th:text="${estado.count}">1</span>
                <label th:for="${'respuesta' + estado.index}" th:text="${pregunta}">Pregunta</label>
            </div>
            <textarea class="form-control" name="respuestas" rows="4" required
                      th:id="${'respuesta' + estado.index}" data-contador
                      placeholder="Escribí tu respuesta…"></textarea>
            <small class="ia-ayuda"><span>0</span> caracteres</small>
        </section>

        <div class="d-flex justify-content-end mt-3">
            <button class="btn btn-primary px-4" type="submit">
                <i class="bi bi-send" aria-hidden="true"></i> Enviar respuestas
            </button>
        </div>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('textarea[data-contador]').forEach(function (area) {
      var contador = area.parentElement.querySelector('.ia-ayuda span');
      area.addEventListener('input', function () { contador.textContent = area.value.length; });
    });
</script>
</body>
</html>
