<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empleos guardados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/vacantes.css}">
  <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body class="vacantes-page saved-jobs-page">
  <nav th:replace="~{fragments/navbar :: appNavbar('jobs', false, true)}"></nav>
  <main class="container page-container">
    <div class="saved-jobs-navigation">
      <a class="btn btn-outline-light page-back nav-action" th:href="@{/home}">
        <i class="bi bi-arrow-left" aria-hidden="true"></i> Volver al inicio
      </a>
      <a class="btn btn-outline-light page-back nav-action" th:href="@{/vacantes/recomendadas}">
        <i class="bi bi-arrow-left" aria-hidden="true"></i> Volver a vacantes
      </a>
    </div>
    <h1>Empleos guardados</h1>
    <div id="empleos-guardados-lista" class="offers-grid">
      <p th:if="${#lists.isEmpty(empleosGuardados)}" class="empty-vacancies" role="status">
        Todavía no guardaste empleos
      </p>
      <a th:if="${#lists.isEmpty(empleosGuardados)}" class="primary-action" th:href="@{/vacantes/recomendadas}">
        Ver vacantes
      </a>
      <article th:each="empleo : ${empleosGuardados}" class="offer-card saved-job-card"
        th:attr="data-oferta-id=${empleo.idOferta}">
        <div class="offer-info">
          <h2 th:text="${empleo.titulo}">Título de la oferta</h2>
          <p th:text="${empleo.empresa}">Empresa</p>
          <div class="offer-meta">
            <span th:if="${empleo.ubicacion != null and !empleo.ubicacion.isBlank()}">
              <i class="bi bi-geo-alt" aria-hidden="true"></i> <span th:text="${empleo.ubicacion}">Ubicación</span>
            </span>
            <span th:if="${empleo.modalidad != null and !empleo.modalidad.isBlank()}">
              <i class="bi bi-laptop" aria-hidden="true"></i> <span th:text="${empleo.modalidad}">Modalidad</span>
            </span>
          </div>
        </div>
        <a th:if="${empleo.url != null and !empleo.url.isBlank()}" class="result-link"
          th:href="${empleo.url}" target="_blank" rel="noopener noreferrer">Ver oferta</a>
        <button type="button" class="save-job-button is-saved" th:attr="data-oferta-id=${empleo.idOferta},
          data-titulo=${empleo.titulo},data-empresa=${empleo.empresa},data-ubicacion=${empleo.ubicacion},
          data-modalidad=${empleo.modalidad},data-url=${empleo.url}"
          data-guardado="true"
          aria-pressed="true" aria-label="Quitar empleo de guardados">
          <i class="bi bi-bookmark-fill" aria-hidden="true"></i>
        </button>
      </article>
    </div>
  </main>
  <script type="module" th:src="@{/js/guardados.js}"></script>
</body>
</html>
