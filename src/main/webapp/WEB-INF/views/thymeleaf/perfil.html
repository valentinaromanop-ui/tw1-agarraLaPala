<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/vacantes.css}">
</head>
<body class="vacantes-page profile-page">
  <main class="container py-4">
    <a th:href="@{/vacantes/recomendadas}">Volver a vacantes</a>
    <h1>Mi perfil</h1>
    <p>Completá tus datos para recibir oportunidades más relevantes.</p>
    <p th:if="${mensaje != null}" th:text="${mensaje}" class="alert alert-success" role="status"></p>
    <p th:if="${error != null}" th:text="${error}" class="alert alert-danger" role="alert"></p>

    <form th:action="@{/perfil/guardar}" th:object="${perfil}" method="post">
      <section class="profile-section">
        <h2 class="h5">Datos de contacto</h2>
        <label class="form-label" for="telefono">Teléfono</label>
        <input class="form-control" id="telefono" th:field="*{telefono}" type="tel" inputmode="numeric" pattern="[0-9]*">
        <label class="form-label mt-3" for="ubicacion">Zona o localidad</label>
        <input class="form-control" id="ubicacion" th:field="*{ubicacion}" type="text">
      </section>

      <section class="profile-section">
        <h2 class="h5">Habilidades de programación</h2>
        <input class="form-control mb-3" id="buscador-skills" type="search" placeholder="Buscar skills">
        <div id="skills-container">
          <div class="skill-option" th:each="skill : ${skills}">
            <button class="skill-button" type="button" th:classappend="${#lists.contains(perfil.skillIds, skill.id)} ? ' selected' : ''" th:data-skill-id="${skill.id}" th:text="${skill.nombre}" th:attr="aria-pressed=${#lists.contains(perfil.skillIds, skill.id)}">Skill</button>
          </div>
        </div>
        <div id="skills-seleccionadas"></div>
      </section>

      <section class="profile-section">
        <h2 class="h5">Idiomas</h2>
        <input class="form-control mb-3" id="buscador-idiomas" type="search" placeholder="Buscar idiomas">
        <div id="idiomas-container">
          <div class="language-option" th:each="idioma : ${idiomasDisponibles}">
            <button class="language-button" type="button" th:classappend="${#maps.containsKey(perfil.idiomas, idioma)} ? ' selected' : ''" th:data-language="${idioma}" th:text="${idioma}" th:attr="aria-pressed=${#maps.containsKey(perfil.idiomas, idioma)}">Idioma</button>
            <select class="language-level" th:data-language="${idioma}" th:classappend="${#maps.containsKey(perfil.idiomas, idioma)} ? '' : ' d-none'">
              <option value="">Nivel opcional</option>
              <option value="Básico" th:selected="${perfil.idiomas[idioma] == 'Básico'}">Básico</option>
              <option value="Intermedio" th:selected="${perfil.idiomas[idioma] == 'Intermedio'}">Intermedio</option>
              <option value="Avanzado" th:selected="${perfil.idiomas[idioma] == 'Avanzado'}">Avanzado</option>
              <option value="Nativo" th:selected="${perfil.idiomas[idioma] == 'Nativo'}">Nativo</option>
            </select>
          </div>
        </div>
        <div id="idiomas-seleccionados"></div>
      </section>

      <section class="profile-section">
        <fieldset>
          <legend class="h5">Disponibilidad horaria</legend>
          <div class="form-check form-check-inline" th:each="opcion : ${ {'Mañana', 'Tarde', 'Noche'} }">
            <input class="form-check-input" type="checkbox" th:field="*{disponibilidadHoraria}" th:value="${opcion}" th:id="${'hora-' + opcion}">
            <label class="form-check-label" th:for="${'hora-' + opcion}" th:text="${opcion}">Mañana</label>
          </div>
          <div class="mt-3">
            <div class="form-check form-check-inline" th:each="dia : ${ {'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'} }">
              <input class="form-check-input" type="checkbox" th:field="*{diasSemana}" th:value="${dia}" th:id="${'dia-' + dia}">
              <label class="form-check-label" th:for="${'dia-' + dia}" th:text="${dia}">Lunes</label>
            </div>
            <button class="btn btn-outline-primary btn-sm all-days-button" id="todos-los-dias" type="button">
              Todos los días
            </button>
          </div>
        </fieldset>
      </section>

      <section class="profile-section">
        <fieldset>
          <legend class="h5">Preferencias laborales</legend>
          <div class="form-check form-check-inline" th:each="modalidad : ${ {'Remoto', 'Híbrido', 'Presencial'} }">
            <input class="form-check-input" type="checkbox" th:field="*{modalidades}" th:value="${modalidad}" th:id="${'modalidad-' + modalidad}">
            <label class="form-check-label" th:for="${'modalidad-' + modalidad}" th:text="${modalidad}">Remoto</label>
          </div>
          <label class="form-label d-block mt-3" for="nivelExperiencia">Nivel de experiencia</label>
          <select class="form-select" id="nivelExperiencia" th:field="*{nivelExperiencia}">
            <option value="">Elegir nivel</option><option value="Estudiante">Estudiante</option><option value="Trainee">Trainee</option><option value="Junior">Junior</option><option value="Semi senior">Semi senior</option>
          </select>
          <label class="form-label d-block mt-3" for="tipoBusqueda">Tipo de búsqueda</label>
          <select class="form-select" id="tipoBusqueda" th:field="*{tipoBusqueda}">
            <option value="">Elegir tipo</option><option value="Pasantía">Pasantía</option><option value="Trainee">Trainee</option><option value="Medio tiempo">Medio tiempo</option><option value="Tiempo completo">Tiempo completo</option>
          </select>
          <label class="form-label d-block mt-3" for="nivelIngles">Nivel de inglés</label>
          <select class="form-select" id="nivelIngles" th:field="*{nivelIngles}">
            <option value="">Elegir nivel</option><option value="Básico">Básico</option><option value="Intermedio">Intermedio</option><option value="Avanzado">Avanzado</option><option value="Nativo">Nativo</option>
          </select>
        </fieldset>
      </section>

      <section class="profile-section">
        <h2 class="h5">Presentación</h2>
        <label class="form-label" for="linkedin">LinkedIn (opcional)</label>
        <input class="form-control" id="linkedin" th:field="*{linkedin}" type="url">
        <label class="form-label mt-3" for="github">GitHub (opcional)</label>
        <input class="form-control" id="github" th:field="*{github}" type="url">
        <label class="form-label mt-3" for="presentacion">Contanos brevemente sobre vos</label>
        <textarea class="form-control" id="presentacion" th:field="*{presentacion}" rows="4" maxlength="500"></textarea>
      </section>

      <button class="btn btn-primary" type="submit">Guardar perfil</button>
    </form>
  </main>
  <script th:src="@{/js/perfil.js}"></script>
</body>
</html>
