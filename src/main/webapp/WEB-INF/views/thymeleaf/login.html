<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Taller Web I</title>

    <!-- Boostrap core css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <!-- custom style -->
    <link rel="stylesheet" th:href="@{/css/login.css}" />
    <link rel="stylesheet" th:href="@{/css/home.css}" />

</head>

<body>

    <nav th:replace="~{fragments/navbar :: appNavbar('login', false)}">
    </nav>

    <main role="main" class="container login-page">

        <div class="login-box">
            <div id="loginbox" class="mainbox">
                <form action="#" th:action="@{/validar-login}" method="POST" th:object="${datosLogin}">
                    <h3 class="form-signin-heading">Taller Web I</h3>
                    <hr class="colorgraph"><br>

                    <label class="visually-hidden" for="email">Correo electrónico</label>
                    <input th:field="*{email}" id="email" type="email" class="form-control" autocomplete="email" required />
                    <label class="visually-hidden" for="password">Contraseña</label>
                    <input th:field="*{password}" type="password" id="password" class="form-control" autocomplete="current-password" required />

                    <button id="btn-login" class="btn btn-lg btn-primary btn-block" Type="Submit"
                        disabled>Ingresar</button>

                    <p id="registro-exitoso" th:if="${param.registro != null}" class="alert alert-success" role="status">
                        Registro exitoso.
                    </p>

                    <p th:if="${error != null}" class="alert alert-danger" th:text="'Error ' + ${error}">
                    </p>
                </form>
                <a id="btn-register" th:href="@{/registro}">¿No tenés cuenta? Registrate</a>
            </div>
        </div>
    </main>
    <!-- /.container -->

    <!-- Boostrap core js -->
    <script type="module" th:src="@{js/login.js}"></script>
</body>

</html>
