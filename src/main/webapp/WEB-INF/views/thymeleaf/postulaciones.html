<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis postulaciones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/vacantes.css}">
</head>
<body class="vacantes-page profile-page">
  <main class="container py-4">
    <a th:href="@{/home}">Volver al inicio</a>
    <h1>Mis postulaciones</h1>
    <p>Consultá las ofertas a las que te postulaste y su estado.</p>

    <div th:if="${#lists.isEmpty(postulaciones)}" class="profile-section">
      <p>No tenés postulaciones enviadas.</p>
    </div>
    <div th:unless="${#lists.isEmpty(postulaciones)}">
      <article class="profile-section" th:each="postulacion : ${postulaciones}">
        <h2 class="h5" th:text="${postulacion.ofertaId}">Oferta</h2>
        <p>
          Estado: <strong th:text="${postulacion.estado}">Enviada</strong>
        </p>
        <p>
          Fecha de postulación:
          <span th:text="${#temporals.format(postulacion.fechaPostulacion, 'dd/MM/yyyy HH:mm')}">Fecha</span>
        </p>
      </article>
    </div>
  </main>
</body>
</html>
