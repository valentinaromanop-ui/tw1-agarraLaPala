<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis postulaciones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/home.css}">
  <link rel="stylesheet" th:href="@{/css/vacantes.css}">
</head>
<body class="vacantes-page profile-page">
  <nav th:replace="~{fragments/navbar :: appNavbar('notifications', false, true)}">
    <div class="container navbar-container justify-content-between">
      <a class="navbar-brand" th:href="@{/home}">Agarra la Pala</a>
      <div th:replace="~{fragments/navbar :: sessionActions(@{/perfil}, 'Mi perfil')}"></div>
    </div>
  </nav>
  <main class="container page-container py-4">
    <a class="btn btn-outline-light page-back" th:href="@{/home}">Volver al inicio</a>
    <h1>Mis postulaciones</h1>
    <p>Consultá las ofertas a las que te postulaste y su estado.</p>

    <div th:if="${#lists.isEmpty(postulaciones)}" class="profile-section">
      <p>No tenés postulaciones registradas.</p>
    </div>
    <div th:unless="${#lists.isEmpty(postulaciones)}">
      <article class="profile-section" th:each="postulacion : ${postulaciones}">
        <h2 class="h5" th:text="${postulacion.titulo ?: postulacion.ofertaId}">Oferta</h2>
        <p th:text="${postulacion.empresa ?: 'Empresa no informada'}">Empresa</p>
        <p th:text="${postulacion.ubicacion ?: 'Ubicación no informada'}">Ubicación</p>
        <p th:text="${postulacion.modalidad ?: 'Modalidad no informada'}">Modalidad</p>
        <p>Estado:
          <strong class="badge estado-postulacion"
            th:classappend="${' ' + postulacion.estado.claseCss}"
            th:text="${postulacion.estado.etiqueta}">Pendiente</strong>
        </p>
        <p>
          Fecha de postulación:
          <span th:text="${#temporals.format(postulacion.fechaPostulacion, 'dd/MM/yyyy HH:mm')}">Fecha</span>
        </p>
      </article>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>
  <footer th:replace="~{fragments/footer :: appFooter}"></footer>
</body>
</html>
