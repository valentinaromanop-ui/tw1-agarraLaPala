<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agarra la Pala | Habilidades más pedidas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/home.css}" />
    <link rel="stylesheet" th:href="@{/css/ia.css}" />
</head>
<body class="ia-pagina">
<nav th:replace="~{fragments/navbar :: appNavbar('jobs', true, false)}"></nav>

<main class="ia-contenedor">
    <header class="ia-encabezado">
        <div class="ia-icono"><i class="bi bi-bar-chart-line" aria-hidden="true"></i></div>
        <div>
            <h1>Habilidades más requeridas</h1>
            <p>Ranking según las ofertas publicadas en la plataforma.</p>
        </div>
    </header>

    <section class="ia-tarjeta">
        <p class="ia-vacio" th:if="${#lists.isEmpty(top)}">Todavía no hay ofertas con habilidades cargadas.</p>
        <ol class="ia-ranking" th:unless="${#lists.isEmpty(top)}">
            <li class="ia-fila" th:each="h, i : ${top}">
          <span class="ia-posicion" th:text="${i.count}"
                th:classappend="${i.index == 0 ? 'oro' : (i.index == 1 ? 'plata' : (i.index == 2 ? 'bronce' : ''))}">1</span>
                <div>
                    <div class="ia-nombre" th:text="${h.nombre()}">Java</div>
                    <div class="ia-barra">
                        <span th:style="${'width:' + (h.cantidad() * 100 / top[0].cantidad()) + '%'}"></span>
                    </div>
                </div>
                <span class="ia-cantidad" th:text="${h.cantidad() + (h.cantidad() == 1 ? ' oferta' : ' ofertas')}">12 ofertas</span>
            </li>
        </ol>
    </section>
    <section class="ia-cta">
        <div>
            <h2><i class="bi bi-mortarboard" aria-hidden="true"></i> Formate en las skills más pedidas</h2>
            <p>Cursos con profesionales en actividad y certificado de asistencia.</p>
        </div>
        <a class="primary-action" th:href="@{/cursos}">
            Ver cursos <i class="bi bi-arrow-up-right" aria-hidden="true"></i>
        </a>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
