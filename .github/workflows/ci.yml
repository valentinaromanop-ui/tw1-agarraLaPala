name: integracion_continua
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
jobs:
  java-tests:
    name: Pruebas Java
    runs-on: ubuntu-latest
    steps:
      - name: Descargando el codigo
        uses: actions/checkout@v4
      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      - name: Corriendo las pruebas
        run: mvn --batch-mode clean test

  javascript-checks:
    name: Lint y pruebas JavaScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/main/webapp/resources/core/js
    steps:
      - name: Descargando el codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/main/webapp/resources/core/js/package-lock.json
      - name: Instalar paquetes de node
        run: npm ci
      - name: Ejecutar linter de javascript (ESLint)
        run: npm run lint
      - name: Ejecutar pruebas de javascript
        run: npm test
